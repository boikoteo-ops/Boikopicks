name: Inspect Covers OU (Manual)

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Descargar HTML de Covers
        run: python -m src.inspect_covers

      - name: Subir HTML como artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: covers-ou-html
          path: out_covers/
          retention-days: 7
