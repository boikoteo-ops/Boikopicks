name: Test Listin Guia (Manual)

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Fecha a probar (YYYY-MM-DD, vacío = hoy)'
        required: false
        default: ''

jobs:
  test-listin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install OCR system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-spa poppler-utils

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify OCR tools installed
        run: |
          tesseract --version
          tesseract --list-langs
          pdftoppm -v 2>&1 | head -5

      - name: Run test_listin
        run: |
          cd src
          if [ -n "${{ github.event.inputs.target_date }}" ]; then
            python test_listin.py "${{ github.event.inputs.target_date }}"
          else
            python test_listin.py
          fi
        continue-on-error: true

      - name: Show OCR output preview
        if: always()
        run: |
          if [ -d "src/out_listin" ]; then
            echo "=== Archivos generados ==="
            ls -la src/out_listin/
            echo ""
            echo "=== Primeras 100 líneas del OCR ==="
            cat src/out_listin/ocr_*.txt 2>/dev/null | head -100 || echo "(sin archivo OCR)"
          else
            echo "No se generó carpeta out_listin"
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: listin-test-output
          path: src/out_listin/
          retention-days: 7
          if-no-files-found: warn
