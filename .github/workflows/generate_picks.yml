name: Generate Picks
on:
  schedule:
    - cron: '0 15 * * *'
    - cron: '0 17 * * *'
    - cron: '0 22 * * *'
  workflow_dispatch:
jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run picks generator
        run: python -m src.main
      - name: Copy picks.json to web folder
        run: cp output/picks.json web/picks.json
      - name: Commit and push if changed
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "github-actions[bot]"
          
          # Stash todo antes de cualquier operacion git
          git stash --include-untracked || true
          
          # Pull primero, ya con stash hecho
          git pull --rebase origin main || true
          
          # Recuperar los cambios stashed
          git stash pop || true
          
          # Ahora si, add y commit
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          
          git commit -m "Auto-update picks $(date -u +%Y-%m-%d\ %H:%M\ UTC)"
          
          # Push con reintento de seguridad
          for i in 1 2 3; do
            if git push; then
              echo "Push exitoso en intento $i"
              exit 0
            fi
            echo "Push fallo en intento $i, reintentando..."
            sleep 3
            git pull --rebase origin main || true
          done
          
          echo "Push fallo despues de 3 intentos"
          exit 1
