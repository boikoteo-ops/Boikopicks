<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0d12">
  <title>Almapicks · MLB & NBA</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%2300d4aa'/><text x='50' y='65' font-family='Arial' font-size='50' font-weight='bold' text-anchor='middle' fill='%230a0d12'>A</text></svg>">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">A</span>
      <span class="brand-name">ALMA<span class="brand-accent">PICKS</span></span>
    </div>
    <div class="live-badge" id="liveBadge">LIVE</div>
  </header>

  <main class="container">

    <section class="date-banner">
      <div class="date-text" id="dateText">Cargando...</div>
      <div class="date-meta" id="dateMeta">—</div>
    </section>

    <section class="hist-strip">
      <div class="hist-item">
        <div class="hist-label">RÉCORD</div>
        <div class="hist-value" id="histRecord">—</div>
        <div class="hist-sub" id="histWinRate">—</div>
      </div>
      <div class="hist-item">
        <div class="hist-label">ROI</div>
        <div class="hist-value" id="histRoi">—</div>
        <div class="hist-sub">históricos</div>
      </div>
      <div class="hist-item">
        <div class="hist-label">RACHA</div>
        <div class="hist-value" id="histStreak">—</div>
        <div class="hist-sub">actual</div>
      </div>
    </section>

    <section class="stats-grid" id="statsGrid">
      <div class="stat-card">
        <div class="stat-label">JUEGOS</div>
        <div class="stat-value" id="statGames">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">PICKS</div>
        <div class="stat-value" id="statPicks">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">PREMIUM</div>
        <div class="stat-value premium" id="statPremium">—</div>
      </div>
    </section>

    <section class="filter-bar">
      <button class="filter-btn active" data-filter="all">Todos</button>
      <button class="filter-btn" data-filter="premium">🔥 Premium</button>
      <button class="filter-btn" data-filter="solido">⭐ Sólido</button>
      <button class="filter-btn" data-filter="valor">💡 Valor</button>
      <button class="filter-btn" data-filter="watch">👀 Watch</button>
    </section>

    <section class="picks-section" id="picksSection">
      <div class="loading">Cargando picks...</div>
    </section>

    <section class="parlays-section" id="parlaysSection"></section>

  </main>

  <footer class="footer">
    <p>Generado automáticamente power by AlmaDigitalRD 𝓼𝓽𝔂𝓵𝓮 ®™ · <span id="lastUpdate">—</span></p>
    <p class="footer-warning">⚠️ Apuesta con responsabilidad. Esto NO es asesoría financiera.</p>
  </footer>

  <script src="team_logos.js"></script>
  <script src="app.js"></script>
</body>
</html>
